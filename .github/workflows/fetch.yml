name: Daily fetch AI news

on:
  schedule:
    # 04:17 UTC = 06:17 CEST (léto) / 05:17 CET (zima)
    # Lichá minuta + nekulatá hodina = mimo špičku → typicky < 5 min queue delay.
    # Cíl: do 07:00 CEST mít inbox/${DATE}.json commitnutý a připravený
    # pro scheduled cowork task v 10:37 CEST.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch sources
        working-directory: scripts
        run: python fetch_sources.py

      - name: Commit inbox changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/
          if git diff --cached --quiet; then
            echo "Žádná novinka, nic neukládám."
          else
            DATE=$(TZ='Europe/Prague' date +"%Y-%m-%d")
            git commit -m "chore(inbox): nightly fetch $DATE"
            git push
          fi

  hub-report:
    # Stav běhu do interního hubu CRUZ (červený vykřičník u projektu + zvoneček).
    # Bez tajných klíčů: hub ověří OIDC token tohoto workflow (audience cruz-hub).
    name: Hlášení do hubu CRUZ
    needs: [fetch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Poslat stav do hubu
        continue-on-error: true
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cruz-hub" | jq -r .value)
          if [ "$FAILED" = "true" ]; then OK=false; else OK=true; fi
          jq -n --argjson ok "$OK" --arg s "$GITHUB_WORKFLOW" --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{project:"AI novinky", match:["ai news","ai-news","novinky"], ok:$ok, source:("ai-news · " + $s), url:$u, message:("GitHub Actions: " + $s + " skončil chybou")}' \
          | curl -sS -m 20 -X POST https://marketplace-template-demo.netlify.app/api/project-alert \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @-
