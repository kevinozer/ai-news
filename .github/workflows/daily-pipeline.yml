name: AI News daily pipeline

# Zatím jen ruční spuštění (workflow_dispatch). Cron se zapne po ověření.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Datum YYYY-MM-DD (prázdné = dnes CEST)"
        required: false
        default: ""
      dry_run:
        description: "true = negeneruj žádný push na živé weby (jen test)"
        required: false
        default: "false"
  # schedule:
  #   - cron: "30 8 * * *"   # 08:30 UTC = 10:30 CEST (léto)

permissions:
  contents: write

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Prague
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_THINK_BUDGET: "2048"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_NEWS_PUSH_TOKEN: ${{ secrets.AI_NEWS_PUSH_TOKEN }}
    steps:
      - name: Checkout ai-news
        uses: actions/checkout@v5

      - name: Checkout ainamiru (pro dedup proti publikovaným)
        uses: actions/checkout@v5
        with:
          repository: cruzmira/ainamiru
          token: ${{ secrets.GH_PAT }}
          path: _ainamiru

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Compute date (CEST)
        id: d
        run: |
          IN="${{ inputs.date }}"
          if [ -n "$IN" ]; then
            echo "date=$IN" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Europe/Prague date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch today's inbox
        run: |
          DATE=${{ steps.d.outputs.date }}
          mkdir -p inbox
          curl -fsSL "https://raw.githubusercontent.com/kevinozer/ai-news/main/inbox/${DATE}.json" -o "inbox/${DATE}.json"
          echo "inbox řádků: $(wc -l < inbox/${DATE}.json)"

      - name: Curate top 15 (Gemini)
        run: |
          DATE=${{ steps.d.outputs.date }}
          python3 scripts/curate_selection.py --date "$DATE" --ai-news . --ainamiru _ainamiru

      - name: Generate PDF digest
        run: |
          DATE=${{ steps.d.outputs.date }}
          ( cd scripts && python3 generate_pdf.py "../digest/${DATE}_selected.json" )
          ls -lh "digest/news_${DATE}.pdf"

      - name: PDF sanity (<=100 stran)
        run: |
          DATE=${{ steps.d.outputs.date }}
          P=$(python3 -c "from pypdf import PdfReader; print(len(PdfReader('digest/news_${DATE}.pdf').pages))")
          echo "stran: $P"
          if [ "$P" -gt 100 ]; then echo "::error::PDF má $P stran — rozbité schéma"; exit 1; fi

      - name: Send PDF to Telegram
        run: |
          DATE=${{ steps.d.outputs.date }}
          curl -sS -F document=@"digest/news_${DATE}.pdf" -F "caption=AI News - ${DATE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument?chat_id=${TELEGRAM_CHAT_ID}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Telegram OK' if r.get('ok') else f'FAIL {r}'); sys.exit(0 if r.get('ok') else 1)"

      - name: Prewarm IG pozadí (Gemini)
        run: |
          DATE=${{ steps.d.outputs.date }}
          for i in 0 1 2 3 4 5 6 7; do
            python3 scripts/generate_posts.py "digest/${DATE}_selected.json" --bg-only $i || true
          done

      - name: IG žargon varianta (_selected_ig.json)
        run: |
          DATE=${{ steps.d.outputs.date }}
          python3 scripts/make_ig_variant.py --date "$DATE" --ai-news . --mode ig

      - name: Složit IG slidy
        run: |
          DATE=${{ steps.d.outputs.date }}
          python3 scripts/generate_posts.py "digest/${DATE}_selected_ig.json" --only ig

      - name: IG caption
        run: |
          DATE=${{ steps.d.outputs.date }}
          python3 scripts/make_ig_variant.py --date "$DATE" --ai-news . --mode caption

      - name: Push slidů na GitHub (pro Make.com)
        run: python3 scripts/push_today_slides.py "${{ steps.d.outputs.date }}"

      - name: ainamiru — připravit šablonu (sibling ai-na-miru)
        run: |
          mkdir -p ../ai-na-miru/articles
          cp templates/article-template.html ../ai-na-miru/articles/article-template.html
          echo "template na místě: $(ls -l ../ai-na-miru/articles/article-template.html)"

      - name: ainamiru — generovat 7 článků
        run: |
          DATE=${{ steps.d.outputs.date }}
          mkdir -p output/articles
          # seed index z publikovaného (zachová historii napříč běhy)
          cp _ainamiru/articles/index.json output/articles/ 2>/dev/null || true
          cp _ainamiru/articles/index.js   output/articles/ 2>/dev/null || true
          for i in 0 1 2 3 4 5 6; do
            python3 scripts/_gen_one_idx.py $i || python3 scripts/_gen_one_idx.py $i || true
          done
          echo "článkových složek: $(ls -d output/articles/${DATE}-*/ 2>/dev/null | wc -l)"

      - name: ainamiru — audit (output)
        run: python3 scripts/check_articles.py --date "${{ steps.d.outputs.date }}"

      - name: ainamiru — sync do repa + audit deploy
        run: |
          DATE=${{ steps.d.outputs.date }}
          cp -r output/articles/${DATE}-*/ _ainamiru/articles/ 2>/dev/null || echo "no new dirs"
          cp output/articles/index.json output/articles/index.js _ainamiru/articles/
          python3 scripts/check_articles.py --date "$DATE" --root _ainamiru/articles

      - name: ainamiru — commit + push
        run: |
          DATE=${{ steps.d.outputs.date }}
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "DRY RUN — ainamiru push přeskočen"; exit 0; fi
          cd _ainamiru
          git config user.email "kevin.ozer@seznam.cz"
          git config user.name "Kevin Ozer (auto)"
          git add articles/
          if git diff --cached --quiet; then
            echo "ainamiru: žádné změny"
          else
            git commit -m "Articles: ${DATE}"
            git fetch origin main -q
            git rebase origin/main -q || git rebase --abort
            git push origin HEAD:main
            echo "ainamiru push OK"
          fi

      - name: CBRE — sync + překlad + build
        env:
          GEMINI_API_KEY: ${{ secrets.CBRE_GEMINI_KEY }}
        run: |
          DATE=${{ steps.d.outputs.date }}
          git clone --depth=1 "https://x-access-token:${{ secrets.GH_PAT }}@github.com/kevinozer/cbre-marketplace.git" /tmp/cbre
          python3 scripts/cbre_sync.py --ainamiru _ainamiru --marketplace /tmp/cbre
          cd /tmp/cbre
          COUNT=$(grep -c "^    slug:" src/data/aiNews.ts || true)
          echo "aiNews.ts slugů: $COUNT"
          if [ "$COUNT" -lt 50 ]; then echo "::error::CBRE regrese <50 článků"; exit 1; fi
          npm install --no-audit --no-fund >/dev/null 2>&1
          for i in 1 2 3 4 5; do
            timeout 120 node scripts/translate-new-articles.mjs ainews 2>&1 | tail -4
            REM=$(grep -cE '^    title: "' src/data/aiNews.ts || true)
            echo "překlad průchod $i: zbývá $REM"
            [ "$REM" = "0" ] && break
          done
          FINAL=$(grep -cE '^    title: "' src/data/aiNews.ts || true)
          if [ "$FINAL" != "0" ]; then echo "::error::CBRE $FINAL nepřeložených"; exit 1; fi
          npx tsc -b 2>&1 | tail -5

      - name: CBRE — commit + push
        run: |
          DATE=${{ steps.d.outputs.date }}
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "DRY RUN — CBRE push přeskočen"; exit 0; fi
          cd /tmp/cbre
          git config user.email "kevin.ozer@seznam.cz"
          git config user.name "Kevin Ozer (auto)"
          git checkout package-lock.json 2>/dev/null || true
          if git status --porcelain | grep -qE "(aiNews\.ts|public/ai-news)"; then
            git add src/data/aiNews.ts public/ai-news/
            git commit -m "chore(aiNews): daily sync ${DATE} (CZ+EN)"
            git fetch origin main -q; git rebase origin/main -q || git rebase --abort
            git push origin HEAD:main
            echo "CBRE push OK"
          else echo "CBRE: bez změn"; fi

      - name: Stanton Chase — sync + build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AINAMIRU_DIR: ${{ github.workspace }}/_ainamiru
          SC_NEWS_DATE: ${{ steps.d.outputs.date }}
        run: |
          git clone --depth=1 "https://x-access-token:${{ secrets.SC_GITHUB_PAT }}@github.com/cruzmira/stanton-chase-ai-hub.git" /tmp/sc
          cd /tmp/sc
          npm ci >/dev/null 2>&1 || npm install --no-audit --no-fund >/dev/null 2>&1
          node scripts/sc-news/select-for-sc.mjs --repo /tmp/sc
          node scripts/sc-news/rewrite-for-sc.mjs --repo /tmp/sc
          node scripts/sc-news/write-articles.mjs --repo /tmp/sc
          npm run build 2>&1 | tail -8

      - name: Stanton Chase — commit + push
        run: |
          DATE=${{ steps.d.outputs.date }}
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "DRY RUN — SC push přeskočen"; exit 0; fi
          cd /tmp/sc
          if git status --porcelain | grep -qE "(aiNews\.ts|news/)"; then
            git config user.email "kevin.ozer@seznam.cz"
            git config user.name "Kevin Ozer (auto)"
            git commit -am "news: SC AI-news sync ${DATE}"
            git pull --rebase origin main -q || true
            git push origin main
            echo "SC push OK"
          else echo "SC: bez změn"; fi

      - name: Verify (end-to-end audit)
        if: ${{ always() }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SC_GITHUB_PAT: ${{ secrets.SC_GITHUB_PAT }}
        run: |
          DATE=${{ steps.d.outputs.date }}
          DRY="${{ inputs.dry_run }}"
          S="$GITHUB_STEP_SUMMARY"
          echo "## AI News pipeline — $DATE $([ "$DRY" = "true" ] && echo '(DRY RUN)')" >> "$S"
          bad=0
          chk(){ if [ "$2" = "OK" ]; then echo "- ✅ $1" >> "$S"; else echo "- ❌ $1: $2" >> "$S"; bad=$((bad+1)); fi; }
          chk "selected.json" "$([ -f digest/${DATE}_selected.json ] && echo OK || echo chybí)"
          chk "PDF digest" "$([ -f digest/news_${DATE}.pdf ] && echo OK || echo chybí)"
          N=$(ls instagram/${DATE}/slide_*.png 2>/dev/null | wc -l); chk "IG slidy (8)" "$([ "$N" = "8" ] && echo OK || echo "jen $N")"
          chk "caption" "$([ -f instagram/${DATE}/caption.txt ] && echo OK || echo chybí)"
          A=$(ls -d output/articles/${DATE}-*/ 2>/dev/null | wc -l); chk "ainamiru články" "$([ "$A" -ge 1 ] && echo OK || echo "jen $A")"
          if [ "$DRY" = "true" ]; then
            echo "- ℹ️ pushe přeskočeny (dry-run)" >> "$S"
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://raw.githubusercontent.com/kevinozer/ai-news/main/instagram/${DATE}/caption.txt")
            chk "slidy na raw (Make.com)" "$([ "$code" = "200" ] && echo OK || echo "HTTP $code")"
            for repo in cruzmira/ainamiru kevinozer/cbre-marketplace; do
              d=$(curl -s -H "Authorization: Bearer $GH_PAT" "https://api.github.com/repos/$repo/commits/main" | python3 -c "import sys,json;print(json.load(sys.stdin)['commit']['committer']['date'][:10])" 2>/dev/null)
              chk "$repo commit $DATE" "$([ "$d" = "$DATE" ] && echo OK || echo "poslední $d")"
            done
            d=$(curl -s -H "Authorization: Bearer $SC_GITHUB_PAT" "https://api.github.com/repos/cruzmira/stanton-chase-ai-hub/commits/main" | python3 -c "import sys,json;print(json.load(sys.stdin)['commit']['committer']['date'][:10])" 2>/dev/null)
            chk "stanton-chase commit $DATE" "$([ "$d" = "$DATE" ] && echo OK || echo "poslední $d")"
          fi
          echo "" >> "$S"
          if [ "$bad" = "0" ]; then echo "**✅ Vše prošlo.**" >> "$S"; echo "VERIFY OK"; else echo "**❌ $bad problémů — viz výše.**" >> "$S"; echo "VERIFY: $bad problémů"; fi
