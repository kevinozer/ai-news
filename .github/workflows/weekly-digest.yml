name: AI News weekly digest (šéf)

# Pondělí 07:00 UTC = 09:00 CEST. Týdenní přehled top ~25 novinek e-mailem šéfovi.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      end:
        description: "Konec okna YYYY-MM-DD (prázdné = dnes)"
        required: false
        default: ""
      dry_run:
        description: "true = vyrob PDF, ale neposílej e-mail"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ai-news-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Prague
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_THINK_BUDGET: "2048"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Compute end date
        id: d
        run: |
          IN="${{ inputs.end }}"
          if [ -n "$IN" ]; then echo "date=$IN" >> "$GITHUB_OUTPUT"; else echo "date=$(TZ=Europe/Prague date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"; fi

      - name: Sestavit týdenní výběr (top ~25)
        run: python3 scripts/weekly_digest.py --ai-news . --end "${{ steps.d.outputs.date }}" --days 7 --target 25

      - name: Vyrobit PDF
        run: |
          DATE=${{ steps.d.outputs.date }}
          ( cd scripts && python3 generate_pdf.py "../digest/weekly_${DATE}.json" )
          ls -lh "digest/news_${DATE}.pdf"

      - name: PDF sanity (<=100 stran)
        run: |
          DATE=${{ steps.d.outputs.date }}
          P=$(python3 -c "from pypdf import PdfReader; print(len(PdfReader('digest/news_${DATE}.pdf').pages))")
          echo "stran: $P"; [ "$P" -le 100 ]

      - name: Odeslat e-mail šéfovi
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
          DATE: ${{ steps.d.outputs.date }}
        run: |
          python3 - <<'PY'
          import os, ssl, smtplib
          from email.message import EmailMessage
          from datetime import datetime
          months=['','ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince']
          DATE=os.environ["DATE"]; d=datetime.strptime(DATE,"%Y-%m-%d")
          datum_cs=f"{d.day}. {months[d.month]} {d.year}"
          msg=EmailMessage()
          msg["From"]=os.environ["GMAIL_USER"]; msg["To"]=os.environ["BOSS_EMAIL"]
          msg["Subject"]=f"AI News — týdenní přehled k {datum_cs}"
          msg.set_content(
              "Dobrý den,\n\nv příloze posílám týdenní přehled nejdůležitějších a "
              "nejzajímavějších novinek ze světa AI za uplynulý týden.\n\nHezký týden.")
          with open(f"digest/news_{DATE}.pdf","rb") as f: data=f.read()
          msg.add_attachment(data, maintype="application", subtype="pdf",
                             filename=f"AI-News-tydenni-{DATE}.pdf")
          ctx=ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com",587) as s:
              s.starttls(context=ctx); s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"]); s.send_message(msg)
          print("E-mail odeslán na", os.environ["BOSS_EMAIL"])
          PY
