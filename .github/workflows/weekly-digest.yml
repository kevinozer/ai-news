name: AI News weekly digest (šéf)

# Pondělí 07:00 UTC = 09:00 CEST. Týdenní přehled top ~25 novinek e-mailem šéfovi.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      end:
        description: "Konec okna YYYY-MM-DD (prázdné = dnes)"
        required: false
        default: ""
      dry_run:
        description: "true = vyrob PDF, ale neposílej e-mail"
        required: false
        default: "false"
      test_to:
        description: "Testovací příjemce (prázdné = šéf z BOSS_EMAIL)"
        required: false
        default: ""
      bez_sefa:
        description: "true = neposílat PDF šéfovi (pro ladění rozesílky)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ai-news-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Prague
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_THINK_BUDGET: "2048"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Compute end date
        id: d
        run: |
          IN="${{ inputs.end }}"
          if [ -n "$IN" ]; then echo "date=$IN" >> "$GITHUB_OUTPUT"; else echo "date=$(TZ=Europe/Prague date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"; fi

      - name: Sestavit týdenní výběr (top ~25)
        run: python3 scripts/weekly_digest.py --ai-news . --end "${{ steps.d.outputs.date }}" --days 7 --target 25

      - name: Vyrobit PDF
        run: |
          DATE=${{ steps.d.outputs.date }}
          ( cd scripts && python3 generate_pdf.py "../digest/weekly_${DATE}.json" )
          ls -lh "digest/news_${DATE}.pdf"

      - name: PDF sanity (<=100 stran)
        run: |
          DATE=${{ steps.d.outputs.date }}
          P=$(python3 -c "from pypdf import PdfReader; print(len(PdfReader('digest/news_${DATE}.pdf').pages))")
          echo "stran: $P"; [ "$P" -le 100 ]

      # bez_sefa umoznuje ladit rozesilku newsletteru, aniz by sefovi pokazde
      # prisel dalsi tydenni prehled. 20. 8. 2026 mu kvuli testovani odesly tri.
      # Planovany pondelni beh vstupy nema, takze pro nej plati puvodni chovani.
      - name: Odeslat e-mail šéfovi
        if: ${{ inputs.dry_run != 'true' && inputs.bez_sefa != 'true' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
          # GMAIL_USER uz neslouzi k prihlaseni, jen jako adresa pro kopii Kevinovi.
          KOPIE_EMAIL: ${{ secrets.GMAIL_USER }}
          TO_OVERRIDE: ${{ inputs.test_to }}
          DATE: ${{ steps.d.outputs.date }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          from datetime import datetime
          months=['','ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince']
          DATE=os.environ["DATE"]; d=datetime.strptime(DATE,"%Y-%m-%d")
          datum_cs=f"{d.day}. {months[d.month]} {d.year}"
          TO=os.environ.get("TO_OVERRIDE") or os.environ["BOSS_EMAIL"]
          telo={
            "from": "CRUZ <newsletter@send.aicruz.cz>",
            "to": [TO],
            "reply_to": ["vladimir.cruz@aicruz.cz"],
            "subject": f"AI News — týdenní přehled k {datum_cs}",
            "text": ("Dobrý den,\n\nv příloze posílám týdenní přehled nejdůležitějších a "
                     "nejzajímavějších novinek ze světa AI za uplynulý týden.\n\nHezký týden."),
          }
          kopie=os.environ.get("KOPIE_EMAIL")
          if kopie and not os.environ.get("TO_OVERRIDE") and kopie!=TO:
              telo["cc"]=[kopie]
          with open(f"digest/news_{DATE}.pdf","rb") as f:
              telo["attachments"]=[{"filename": f"AI-News-tydenni-{DATE}.pdf",
                                    "content": base64.b64encode(f.read()).decode()}]
          rq=urllib.request.Request("https://api.resend.com/emails",
                                    data=json.dumps(telo).encode(), method="POST")
          rq.add_header("Authorization","Bearer "+os.environ["RESEND_API_KEY"])
          rq.add_header("Content-Type","application/json")
          try:
              with urllib.request.urlopen(rq) as x:
                  print("E-mail odeslán na", TO, "| id:", json.loads(x.read()).get("id"))
          except urllib.error.HTTPError as e:
              print("Resend HTTP", e.code, e.read().decode()[:400]); raise
          PY

      # Stejny tydenni vyber posleme i odberatelum newsletteru na aicruz.cz,
      # ale jako HTML s odkazy misto PDF prilohy. Rozesila Resend Broadcast
      # do segmentu, takze odhlasovani resi Resend sam.
      # Preskakuje se pri dry_run i pri testovacim prijemci, at test nerozesle
      # newsletter cele databazi.
      - name: Rozeslat newsletter odberatelum
        if: ${{ !cancelled() && inputs.dry_run != 'true' && inputs.test_to == '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATE: ${{ steps.d.outputs.date }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY neni nastaven, newsletter se nerozeslal"
            exit 0
          fi
          python3 scripts/newsletter_send.py --ai-news . --end "$DATE"

      # Pojistka: kdyz cokoliv v tomhle jobu selze, prijde o tom zprava.
      # 17. 8. 2026 spadla rozesilka na 403 z Resendu a nikdo o tom dva dny nevedel.
      # 31. 8. 2026 spadl sefovsky e-mail na vyprsenem Gmail app passwordu — a protoze
      # tohle upozorneni jelo taky pres Gmail, nedoslo ani ono. Proto ted Telegram:
      # nezavisly kanal na Resendu i na Gmailu, ktery denni pipeline pouziva kazdy den.
      - name: Upozornit na selhani
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEH: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          tok=os.environ.get("TELEGRAM_BOT_TOKEN"); chat=os.environ.get("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              print("chybi TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID, upozorneni se neposila")
              raise SystemExit(0)
          text=("Tydenni AI News: rozesilka SELHALA.\n\n"
                "Workflow 'AI News weekly digest' skoncilo chybou — tenhle tyden nejspis "
                "nedostal PDF sef ani newsletter odberatele.\n\n"
                f"Log behu: {os.environ.get('BEH','')}")
          rq=urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage",
                                    data=json.dumps({"chat_id":chat,"text":text}).encode(),
                                    method="POST")
          rq.add_header("Content-Type","application/json")
          with urllib.request.urlopen(rq) as x:
              print("upozorneni odeslano na Telegram")
          PY
