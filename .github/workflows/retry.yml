name: AI News retry

# Když denní pipeline selže, zopakuj ji (max 2 pokusy navíc). Díky idempotenci
# se dodělá jen to, co chybí. Běží na GitHubu, nezávisle na PC.
on:
  workflow_run:
    workflows: ["AI News daily pipeline"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs (bounded)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Pipeline run ${{ github.event.workflow_run.id }} selhal (pokus ${{ github.event.workflow_run.run_attempt }}/3)."
          echo "Čekám 60s a spouštím znovu jen failed joby (idempotentní dodělání)."
          sleep 60
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
          echo "Re-run vyžádán."
